<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>504 &mdash; Gateway Timeout</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f8fafc;
      color: #334155;
    }
    @media (prefers-color-scheme: dark) {
      body { background: #0f172a; color: #cbd5e1; }
      .code { color: #1e293b; }
      h1 { color: #f1f5f9; }
    }
    .container { text-align: center; padding: 2rem; }
    .code {
      font-size: clamp(6rem, 20vw, 10rem);
      font-weight: 800;
      line-height: 1;
      letter-spacing: -.025em;
      color: #e2e8f0;
      margin-bottom: .25rem;
    }
    h1 {
      font-size: 1.375rem;
      font-weight: 600;
      color: #0f172a;
      margin-bottom: .75rem;
    }
    p {
      font-size: .9375rem;
      line-height: 1.6;
      max-width: 26rem;
      margin: 0 auto;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="code">504</div>
    <h1>Gateway Timeout</h1>
    <p>The server did not receive a timely response from the upstream server.</p>
  </div>
</body>
</html>
