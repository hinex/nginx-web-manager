<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>No site configured</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f8fafc;
      color: #334155;
    }
    @media (prefers-color-scheme: dark) {
      body { background: #0f172a; color: #cbd5e1; }
      .card { background: #1e293b; border-color: #334155; }
      h1 { color: #f1f5f9; }
      .icon { color: #475569; }
      .divider { border-color: #334155; }
      .hint { color: #64748b; }
    }
    .card {
      text-align: center;
      padding: 3rem 2.5rem;
      max-width: 28rem;
      border: 1px solid #e2e8f0;
      border-radius: 1rem;
      background: #fff;
    }
    .icon {
      width: 4rem;
      height: 4rem;
      margin: 0 auto 1.5rem;
      color: #cbd5e1;
    }
    h1 {
      font-size: 1.375rem;
      font-weight: 600;
      color: #0f172a;
      margin-bottom: .5rem;
    }
    p {
      font-size: .9375rem;
      line-height: 1.6;
      color: inherit;
    }
    .divider {
      border: none;
      border-top: 1px solid #e2e8f0;
      margin: 1.5rem 0;
    }
    .hint {
      font-size: .8125rem;
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <div class="card">
    <svg class="icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" d="M12 21a9.004 9.004 0 0 0 8.716-6.747M12 21a9.004 9.004 0 0 1-8.716-6.747M12 21c2.485 0 4.5-4.03 4.5-9S14.485 3 12 3m0 18c-2.485 0-4.5-4.03-4.5-9S9.515 3 12 3m0 0a8.997 8.997 0 0 1 7.843 4.582M12 3a8.997 8.997 0 0 0-7.843 4.582m15.686 0A11.953 11.953 0 0 1 12 10.5c-2.998 0-5.74-1.1-7.843-2.918m15.686 0A8.959 8.959 0 0 1 21 12c0 .778-.099 1.533-.284 2.253m0 0A17.919 17.919 0 0 1 12 16.5a17.92 17.92 0 0 1-8.716-2.247m0 0A8.966 8.966 0 0 1 3 12c0-1.97.633-3.794 1.708-5.278" />
    </svg>
    <h1>No site configured</h1>
    <p>There is no website configured for this domain yet.</p>
    <hr class="divider">
    <p class="hint">If you are the administrator, add a proxy host in the management panel.</p>
  </div>
</body>
</html>
